name: CI

on:
  push:
    branches: [main, version-16]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, compile, JSON and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff pytest
      - name: Ruff (errors and likely bugs)
        run: ruff check sacco_manager --select F,E9,B --ignore B904,B008
      - name: Python compiles
        run: python -m compileall -q sacco_manager
      - name: DocType / report / workspace JSON is valid
        run: python sacco_manager/tests/check_json.py
      - name: Unit tests (no database)
        run: pytest -q sacco_manager/tests/test_pure.py
