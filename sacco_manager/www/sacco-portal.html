{% extends "templates/web.html" %}
{% block title %}SACCO Member Portal{% endblock %}

{% block head_include %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
#sacco-portal-root{
  font-family:'DM Sans',sans-serif;font-size:14px;
  color:#1a1a1a;background:#f4f2ee;min-height:100vh;padding-bottom:60px;
}
/* ---- NAVBAR ---- */
.sp-navbar{
  background:#fff;border-bottom:1px solid #e5e0d8;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  height:60px;position:sticky;top:0;z-index:100;
}
.sp-brand{display:flex;align-items:center;gap:10px}
.sp-brand-icon{width:34px;height:34px;background:#1a3c2e;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-brand-icon svg{width:18px;height:18px;fill:#a8d5b5}
.sp-brand-name{font-size:15px;font-weight:600;color:#1a1a1a;letter-spacing:-.02em}
.sp-brand-sub{font-size:11px;color:#888;letter-spacing:.02em;text-transform:uppercase}
.sp-user-pill{display:flex;align-items:center;gap:10px;background:#f4f2ee;border:1px solid #e5e0d8;border-radius:40px;padding:5px 14px 5px 5px}
.sp-avatar{width:30px;height:30px;border-radius:50%;background:#1a3c2e;color:#a8d5b5;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-user-name{font-size:13px;font-weight:500;color:#1a1a1a}
.sp-user-id{font-size:11px;color:#888}
.sp-status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}
/* ---- LAYOUT ---- */
.sp-layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 24px;gap:24px}
.sp-sidebar{width:196px;flex-shrink:0}
.sp-main{flex:1;min-width:0}
.sp-sidenav{background:#fff;border:1px solid #e5e0d8;border-radius:14px;overflow:hidden;position:sticky;top:84px}
.sp-sidenav-section{padding:10px 8px;border-bottom:1px solid #f0ece6}
.sp-sidenav-section:last-child{border-bottom:none}
.sp-sidenav-label{font-size:10px;font-weight:600;color:#aaa;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px 8px}
.sp-nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#555;font-size:13px;font-weight:500;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left}
.sp-nav-item:hover{background:#f4f2ee;color:#1a1a1a}
.sp-nav-item.active{background:#1a3c2e;color:#a8d5b5}
.sp-nav-item svg{width:16px;height:16px;flex-shrink:0;color:#aaa}
.sp-nav-item.active svg{color:#a8d5b5}
/* ---- SECTION ---- */
.sp-section{display:none}
.sp-section.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp-section-header{margin-bottom:20px}
.sp-section-title{font-size:20px;font-weight:600;color:#1a1a1a;letter-spacing:-.03em;margin-bottom:2px}
.sp-section-sub{font-size:13px;color:#888}
/* ---- OVERVIEW HERO ---- */
.sp-hero{
  background:#fff;border:1px solid #e5e0d8;border-radius:16px;
  padding:22px 24px;display:flex;gap:20px;align-items:flex-start;margin-bottom:16px;
}
.sp-hero-avatar{
  width:56px;height:56px;border-radius:50%;background:#1a3c2e;color:#a8d5b5;
  font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sp-hero-info{flex:1}
.sp-hero-name{font-size:19px;font-weight:600;color:#1a1a1a;letter-spacing:-.025em;margin-bottom:4px}
.sp-hero-meta{font-size:12px;color:#888;margin-bottom:10px}
.sp-hero-badges{display:flex;gap:7px;flex-wrap:wrap}
.sp-hero-score{text-align:right;flex-shrink:0}
.sp-hero-score-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin-bottom:4px}
.sp-hero-score-val{font-size:26px;font-weight:600;color:#1a3c2e;letter-spacing:-.03em;line-height:1}
.sp-hero-score-max{font-size:12px;color:#aaa;font-weight:400}
/* ---- METRICS ---- */
.sp-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.sp-metric{background:#fff;border:1px solid #e5e0d8;border-radius:12px;padding:16px}
.sp-metric.accent{background:#1a3c2e;border-color:#1a3c2e}
.sp-metric-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin-bottom:8px}
.sp-metric.accent .sp-metric-label{color:#5a9972}
.sp-metric-value{font-size:21px;font-weight:600;color:#1a1a1a;letter-spacing:-.03em;line-height:1.1}
.sp-metric.accent .sp-metric-value{color:#fff}
.sp-metric-sub{font-size:11px;color:#aaa;margin-top:5px}
.sp-metric.accent .sp-metric-sub{color:#5a9972}
/* ---- TWO PANEL ROW ---- */
.sp-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
/* ---- CARD ---- */
.sp-card{background:#fff;border:1px solid #e5e0d8;border-radius:14px;padding:20px;margin-bottom:16px}
.sp-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sp-card-title{font-size:13px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:8px}
.sp-card-title svg{width:15px;height:15px;color:#aaa}
.sp-card-action{font-size:12px;color:#1a3c2e;font-weight:500;cursor:pointer;background:none;border:none;padding:0}
.sp-card-action:hover{text-decoration:underline}
/* ---- CREDIT GAUGE ---- */
.sp-gauge-track{height:10px;background:#f0ece6;border-radius:6px;overflow:hidden;margin:10px 0 5px}
.sp-gauge-fill{height:100%;border-radius:6px;transition:width .6s}
.sp-gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa}
/* ---- UPCOMING REPAYMENTS ---- */
.sp-repay-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f7f5f2}
.sp-repay-item:last-child{border-bottom:none}
.sp-repay-date{text-align:center;min-width:36px}
.sp-repay-day{font-size:19px;font-weight:600;color:#1a3c2e;line-height:1}
.sp-repay-mon{font-size:10px;color:#aaa;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sp-repay-label{font-size:13px;font-weight:500;margin-bottom:2px}
.sp-repay-sub{font-size:11px;color:#aaa}
.sp-repay-amt{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:#1a1a1a;white-space:nowrap}
/* ---- LOAN MINI CARD ---- */
.sp-loan-mini{border:1px solid #f0ece6;border-radius:10px;padding:13px;margin-bottom:10px}
.sp-loan-mini:last-child{margin-bottom:0}
.sp-loan-mini-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.sp-loan-mini-name{font-size:13px;font-weight:600;margin-bottom:2px}
.sp-loan-mini-meta{font-size:11px;color:#aaa}
.sp-loan-mini-bar{height:5px;background:#f0ece6;border-radius:3px;overflow:hidden;margin:7px 0 5px}
.sp-loan-mini-fill{height:100%;border-radius:3px;background:#1a3c2e}
.sp-loan-mini-pct{font-size:11px;color:#aaa}
/* ---- ACTIVITY FEED ---- */
.sp-act-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f7f5f2}
.sp-act-item:last-child{border-bottom:none;padding-bottom:0}
.sp-act-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.sp-act-text{font-size:13px;line-height:1.45;color:#1a1a1a}
.sp-act-time{font-size:11px;color:#aaa;margin-top:2px}
/* ---- TABLES ---- */
.sp-table-wrap{overflow-x:auto}
table.sp-table{width:100%;border-collapse:collapse;font-size:13px}
.sp-table th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#aaa;padding:0 0 10px;border-bottom:1px solid #f0ece6;white-space:nowrap}
.sp-table th:not(:first-child){padding-left:16px}
.sp-table td{padding:11px 0;border-bottom:1px solid #f7f5f2;color:#1a1a1a;vertical-align:middle}
.sp-table td:not(:first-child){padding-left:16px}
.sp-table tr:last-child td{border-bottom:none}
.sp-table .num{font-family:'DM Mono',monospace;font-size:12px;text-align:right}
.sp-table th.num{text-align:right}
.cr{color:#16a34a;font-weight:500}
.dr{color:#dc2626;font-weight:500}
/* ---- PILLS ---- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.pill-green{background:#dcfce7;color:#15803d}
.pill-amber{background:#fef9c3;color:#92400e}
.pill-red{background:#fee2e2;color:#991b1b}
.pill-blue{background:#dbeafe;color:#1e40af}
.pill-gray{background:#f3f4f6;color:#4b5563}
.pill-purple{background:#f3e8ff;color:#6b21a8}
/* ---- FULL LOAN CARD ---- */
.sp-loan-card{border:1px solid #e5e0d8;border-radius:12px;padding:18px;margin-bottom:12px;background:#fff;transition:border-color .15s}
.sp-loan-card:hover{border-color:#1a3c2e}
.sp-loan-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sp-loan-name{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.sp-loan-meta{font-size:12px;color:#aaa}
.sp-loan-bar-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}
.sp-loan-bar{height:7px;background:#f0ece6;border-radius:4px;overflow:hidden}
.sp-loan-bar-fill{height:100%;background:#1a3c2e;border-radius:4px;transition:width .6s}
.sp-loan-bar-fill.late{background:#dc2626}
.sp-loan-stats{display:flex;gap:20px;font-size:12px;color:#555;margin-top:10px}
.sp-loan-stat span{display:block;font-size:10px;color:#aaa;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.sp-loan-stat strong{font-family:'DM Mono',monospace;font-size:13px;color:#1a1a1a}
.sp-loan-schedule-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:#1a3c2e;font-weight:500;cursor:pointer;background:none;border:none;padding:0;margin-top:12px}
.sp-loan-schedule-wrap{display:none;margin-top:12px;border-top:1px solid #f0ece6;padding-top:12px}
.sp-loan-schedule-wrap.open{display:block}
/* ---- FORMS ---- */
.sp-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:600px){.sp-form-grid{grid-template-columns:1fr}}
.sp-form-group{display:flex;flex-direction:column;gap:6px}
.sp-form-group label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#aaa}
.sp-form-group input,.sp-form-group select,.sp-form-group textarea{
  padding:9px 12px;border:1px solid #e5e0d8;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;background:#fff;
  outline:none;transition:border-color .15s;
}
.sp-form-group input:focus,.sp-form-group select:focus,.sp-form-group textarea:focus{border-color:#1a3c2e}
.sp-form-group textarea{resize:vertical;height:80px}
.sp-form-hint{font-size:11px;color:#aaa;margin-top:2px}
.sp-form-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:1px solid #f0ece6;margin-top:6px}
/* ---- GUARANTOR SECTION ---- */
.sp-guarantor-card{
  border:1px solid #e5e0d8;border-radius:10px;padding:13px 14px;
  margin-bottom:10px;display:flex;align-items:center;gap:12px;
  transition:border-color .15s;
}
.sp-guarantor-card:last-child{margin-bottom:0}
.sp-guarantor-card:hover{border-color:#1a3c2e}
.sp-g-avatar{width:36px;height:36px;border-radius:50%;background:#e8f5e9;color:#1a3c2e;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-g-info{flex:1;min-width:0}
.sp-g-name{font-size:13px;font-weight:600;margin-bottom:2px}
.sp-g-sub{font-size:11px;color:#aaa}
.sp-g-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sp-g-shares-input{width:80px;padding:6px 9px;border:1px solid #e5e0d8;border-radius:7px;font-size:13px;font-family:'DM Mono',monospace;color:#1a1a1a;background:#fff;outline:none}
.sp-g-shares-input:focus{border-color:#1a3c2e}
.sp-g-remove{background:none;border:none;cursor:pointer;color:#aaa;padding:4px;border-radius:6px;transition:color .12s,background .12s;display:flex;align-items:center}
.sp-g-remove:hover{color:#dc2626;background:#fee2e2}
.sp-g-remove svg{width:14px;height:14px}
.sp-guarantor-summary{
  background:#f0f7f4;border:1px solid #a8d5b5;border-radius:10px;
  padding:12px 14px;font-size:12px;color:#1a3c2e;display:flex;
  justify-content:space-between;align-items:center;margin-top:10px;
}
.sp-add-guarantor-btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;
  border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;
  font-weight:500;cursor:pointer;border:1px dashed #aaa;
  background:none;color:#555;transition:all .15s;margin-top:12px;
}
.sp-add-guarantor-btn:hover{border-color:#1a3c2e;color:#1a3c2e;background:#f0f7f4}
/* ---- MEMBER SEARCH DROPDOWN ---- */
.sp-member-search-wrap{position:relative;margin-bottom:12px}
.sp-member-search-input{width:100%;padding:9px 12px;border:1px solid #e5e0d8;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;background:#fff;outline:none;transition:border-color .15s}
.sp-member-search-input:focus{border-color:#1a3c2e}
.sp-member-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
  border:1px solid #e5e0d8;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.08);
  z-index:200;max-height:220px;overflow-y:auto;display:none;
}
.sp-member-dropdown.open{display:block}
.sp-member-option{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s}
.sp-member-option:hover{background:#f4f2ee}
.sp-member-option:not(:last-child){border-bottom:1px solid #f7f5f2}
.sp-member-opt-avatar{width:28px;height:28px;border-radius:50%;background:#e8f5e9;color:#1a3c2e;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-member-opt-name{font-size:13px;font-weight:500;color:#1a1a1a}
.sp-member-opt-sub{font-size:11px;color:#aaa}
/* ---- PLEDGE PROGRESS ---- */
.sp-pledge-progress{margin:14px 0}
.sp-pledge-bar{height:8px;background:#f0ece6;border-radius:4px;overflow:hidden;margin-bottom:6px}
.sp-pledge-fill{height:100%;border-radius:4px;background:#1a3c2e;transition:width .6s}
.sp-pledge-fill.over{background:#22c55e}
.sp-pledge-fill.under{background:#d97706}
/* ---- LIMIT BAR ---- */
.sp-limit-bar-wrap{margin:16px 0}
.sp-limit-labels{display:flex;justify-content:space-between;font-size:12px;color:#555;margin-bottom:6px}
.sp-limit-bar{height:8px;background:#f0ece6;border-radius:4px;overflow:hidden}
.sp-limit-fill{height:100%;border-radius:4px;background:#1a3c2e;transition:width .6s}
.sp-limit-fill.danger{background:#dc2626}
/* ---- BUTTONS ---- */
.sp-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent}
.sp-btn-primary{background:#1a3c2e;color:#fff;border-color:#1a3c2e}
.sp-btn-primary:hover{background:#122b21}
.sp-btn-primary:disabled{background:#aaa;border-color:#aaa;cursor:not-allowed}
.sp-btn-ghost{background:#fff;color:#1a1a1a;border-color:#e5e0d8}
.sp-btn-ghost:hover{background:#f4f2ee}
.sp-btn svg{width:15px;height:15px}
/* ---- ALERTS / INFO ---- */
.sp-info-box{background:#f0f7f4;border:1px solid #a8d5b5;border-radius:10px;padding:12px 16px;font-size:13px;color:#1a3c2e;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.sp-info-box svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.sp-alert{border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.sp-alert-success{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.sp-alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.sp-alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
/* ---- SKELETON ---- */
.sp-skeleton{background:linear-gradient(90deg,#f0ece6 25%,#e8e4df 50%,#f0ece6 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sp-skel-metric{height:82px;border-radius:12px;margin-bottom:4px}
.sp-skel-row{height:40px;border-radius:6px;margin-bottom:8px}
/* ---- MISC ---- */
.sp-empty{text-align:center;padding:48px 24px;color:#aaa}
.sp-empty svg{width:40px;height:40px;margin:0 auto 12px;display:block;opacity:.4}
.sp-empty p{font-size:13px}
.sp-filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sp-filter-row select,.sp-filter-row input[type=month]{padding:7px 12px;border:1px solid #e5e0d8;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;background:#fff;outline:none}
/* ---- APPLICATIONS LIST ---- */
.sp-app-card{border:1px solid #e5e0d8;border-radius:12px;padding:16px 18px;margin-bottom:10px;background:#fff}
.sp-app-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sp-app-name{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.sp-app-meta{font-size:12px;color:#aaa}
.sp-app-guarantors{margin-top:10px;padding-top:10px;border-top:1px solid #f0ece6}
.sp-app-guarantors-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin-bottom:8px}
.sp-guarantor-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sp-guarantor-row:last-child{margin-bottom:0}
/* ---- RESPONSIVE ---- */
@media(max-width:700px){
  .sp-layout{flex-direction:column;padding:16px}
  .sp-sidebar{width:100%}
  .sp-sidenav{position:static}
  .sp-nav-item{padding:7px 12px;font-size:12px}
  .sp-panels{grid-template-columns:1fr}
  .sp-hero{flex-wrap:wrap}
}
.sp-member-option-disabled{opacity:.45;cursor:not-allowed!important;pointer-events:none}
</style>
{% endblock %}

{% block page_content %}
<div id="sacco-portal-root">
  <div style="display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:12px">
    <div class="sp-skeleton" style="width:200px;height:20px"></div>
    <div class="sp-skeleton" style="width:140px;height:14px;margin-top:4px"></div>
  </div>
</div>

<script>
(function () {
"use strict";

var fmt_kes = function(n){ return "KES " + Number(n||0).toLocaleString("en-KE",{minimumFractionDigits:0,maximumFractionDigits:0}); };
var fmt_date = function(d){ if(!d) return "--"; var dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString("en-KE",{day:"2-digit",month:"short",year:"numeric"}); };
var fmt_date_short = function(d){ if(!d) return "--"; var dt=new Date(d); return isNaN(dt)?d:dt.toLocaleDateString("en-KE",{day:"2-digit",month:"short"}); };
var esc = function(s){ return frappe.utils.escape_html(String(s||"")); };
var initials = function(name){ return (name||"??").split(" ").slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase(); };
var flt = function(v){ return parseFloat(v||0)||0; };
var day_of = function(d){ if(!d) return "--"; var dt=new Date(d); return isNaN(dt)?"--":dt.getDate(); };
var mon_of = function(d){ if(!d) return "--"; var dt=new Date(d); return isNaN(dt)?"--":dt.toLocaleString("en-KE",{month:"short"}); };

/* ---- Icons ---- */

var api = function(method, args){
  return new Promise(function(resolve, reject){
    frappe.call({
      method: "sacco_manager.api.sacco_portal." + method,
      args: args || {},
      callback: function(r){ if(r.exc){ reject(r.exc); } else { resolve(r.message); } },
      error: function(e){ reject(e); }
    });
  });
};

var S = { tab:"overview", summary:null, savings_tx:null, shares:null, loan_types:null, applications:null };
var root = document.getElementById("sacco-portal-root");

/* ================================================================
   SHELL
================================================================ */
function renderShell(s){
  var m = s.member;
  var full = m.full_name || ((m.first_name||"") + " " + (m.last_name||"")).trim();
  root.innerHTML = [
    '<nav class="sp-navbar">',
      '<div class="sp-brand">',
        '<div class="sp-brand-icon">',I.sacco,'</div>',
        '<div><div class="sp-brand-name">SACCO Portal</div><div class="sp-brand-sub">Member self-service</div></div>',
      '</div>',
      '<div class="sp-user-pill">',
        '<div class="sp-avatar">',initials(full),'</div>',
        '<div><div class="sp-user-name">',esc(full),'</div><div class="sp-user-id">',esc(m.member_no||m.name),' &middot; ',esc(m.branch||"--"),'</div></div>',
        '<div class="sp-status-dot"></div>',
      '</div>',
    '</nav>',
    '<div class="sp-layout">',
      '<aside class="sp-sidebar">',
        '<nav class="sp-sidenav">',
          '<div class="sp-sidenav-section">',
            '<div class="sp-sidenav-label">Menu</div>',
            navBtn("overview","Overview",I.home),
            navBtn("savings","Savings",I.piggy),
            navBtn("shares","Shares",I.chart),
            navBtn("transactions","Transactions",I.list),
            navBtn("loans","Loans",I.credit),
            navBtn("applications","Applications",I.clock),
          '</div>',
          '<div class="sp-sidenav-section">',
            '<div class="sp-sidenav-label">Actions</div>',
            navBtn("apply","Apply for loan",I.plus),
          '</div>',
          '<div class="sp-sidenav-section">',
            '<button class="sp-nav-item" onclick="window.location.href=\'/login\'" style="color:#888">',I.logout,' Sign out</button>',
          '</div>',
        '</nav>',
      '</aside>',
      '<main class="sp-main" id="sp-main"></main>',
    '</div>',
  ].join("");
  document.querySelectorAll(".sp-nav-item[data-tab]").forEach(function(b){
    b.addEventListener("click", function(){ showTab(b.dataset.tab); });
  });
  showTab("overview");
}

function navBtn(tab, label, icon){
  return '<button class="sp-nav-item'+(tab===S.tab?" active":"") +'" data-tab="'+tab+'">'+icon+" "+label+"</button>";
}
function setNav(tab){
  document.querySelectorAll(".sp-nav-item[data-tab]").forEach(function(b){
    b.classList.toggle("active", b.dataset.tab===tab);
  });
}
function showTab(tab){
  S.tab=tab; setNav(tab);
  var main=document.getElementById("sp-main");
  if(!main) return;
  if(tab==="overview")      { main.innerHTML=renderOverview(S.summary); }
  else if(tab==="savings")  { renderSavingsTab(main); }
  else if(tab==="shares")   { renderSharesTab(main); }
  else if(tab==="transactions"){ renderTxTab(main); }
  else if(tab==="loans")    { renderLoansTab(main); }
  else if(tab==="applications"){ renderApplicationsTab(main); }
  else if(tab==="apply")    { renderApplyTab(main); }
}
window.spTab = function(t){ showTab(t); };

/* ================================================================
   OVERVIEW — Redesigned
================================================================ */
function renderOverview(s){
  var m = s.member;
  var full = m.full_name || ((m.first_name||"")+" "+(m.last_name||"")).trim();
  var loans = s.active_loans || [];
  var outstanding = flt(s.outstanding_loans);
  var limit = flt(s.loan_limit);
  var avail = Math.max(0, limit - outstanding);
  var used_pct = limit > 0 ? Math.min(100,(outstanding/limit*100)) : 0;

  var h = new Date().getHours();
  var greet = h<12?"morning":h<17?"afternoon":"evening";
  var fname = full.split(" ")[0];

  /* Score: simple heuristic for display */
  var score = 100;
  if(used_pct > 80) score -= 20;
  else if(used_pct > 60) score -= 10;
  if(s.savings_balance < 5000) score -= 10;
  score = Math.max(50, Math.min(100, score));

  /* Upcoming repayments — next 3 installments across all loans */
  var upcoming = [];
  loans.forEach(function(l){
    if(l.next_payment_date && l.monthly_repayment_amount){
      upcoming.push({ date:l.next_payment_date, label:l.loan_type||l.name, ref:l.name, amount:l.monthly_repayment_amount });
    }
  });
  upcoming.sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  upcoming = upcoming.slice(0,3);

  /* Gauge color */
  var gaugeColor = used_pct > 85 ? "#dc2626" : used_pct > 65 ? "#d97706" : "#1a3c2e";
  var gaugeLabel = used_pct > 85 ? "High risk" : used_pct > 65 ? "Moderate" : "Healthy";
  var gaugeLabelColor = used_pct > 85 ? "#dc2626" : used_pct > 65 ? "#d97706" : "#16a34a";

  var pendingApps = (s.pending_applications||0);

  var h_badges = [
    '<span class="pill pill-green">'+esc(m.status||"Active")+'</span>',
    loans.length ? '<span class="pill pill-blue">'+loans.length+' active loan'+(loans.length>1?"s":"")+'</span>' : "",
    pendingApps ? '<span class="pill pill-amber">'+pendingApps+' pending application'+(pendingApps>1?"s":"")+'</span>' : "",
  ].filter(Boolean).join(" ");

  return [
    '<div class="sp-section active">',

    /* Hero */
    '<div class="sp-hero">',
      '<div class="sp-hero-avatar">',initials(full),'</div>',
      '<div class="sp-hero-info">',
        '<div class="sp-hero-name">Good '+greet+', '+esc(fname)+' \u{1F44B}</div>',
        '<div class="sp-hero-meta">',esc(m.member_no||m.name),' &middot; ',esc(m.branch||"--"),' &middot; Member since ',fmt_date(m.joining_date),'</div>',
        '<div class="sp-hero-badges">',h_badges,'</div>',
      '</div>',
      '<div class="sp-hero-score">',
        '<div class="sp-hero-score-label">Member score</div>',
        '<div class="sp-hero-score-val">',score,' <span class="sp-hero-score-max">/ 100</span></div>',
      '</div>',
    '</div>',

    /* Top metrics */
    '<div class="sp-metrics">',
      metric("accent","Savings balance",fmt_kes(s.savings_balance), s.savings&&s.savings.name?esc(s.savings.name):""),
      metric("","Share capital",(s.total_shares||0).toLocaleString()+" shares",fmt_kes(s.share_value)+" value"),
      metric("","Total outstanding",fmt_kes(outstanding),loans.length+" loan"+(loans.length!==1?"s":"")+" active"),
      metric("","Available credit",fmt_kes(avail),"of "+fmt_kes(limit)+" limit"),
    '</div>',

    /* Two panels: credit gauge + upcoming repayments */
    '<div class="sp-panels">',
      /* Credit gauge panel */
      '<div class="sp-card" style="margin-bottom:0">',
        '<div class="sp-card-header"><div class="sp-card-title">',I.shield,' Credit health</div>',
          '<span style="font-size:12px;color:'+gaugeLabelColor+';font-weight:600">',gaugeLabel,'</span>',
        '</div>',
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">',
          '<span style="font-size:26px;font-weight:600;letter-spacing:-.03em;color:#1a1a1a">',used_pct.toFixed(0),'%</span>',
          '<span style="font-size:12px;color:#aaa">of limit used</span>',
        '</div>',
        '<div class="sp-gauge-track"><div class="sp-gauge-fill" style="width:'+used_pct.toFixed(0)+'%;background:'+gaugeColor+'"></div></div>',
        '<div class="sp-gauge-labels">',
          '<span>KES 0</span><span style="color:'+gaugeLabelColor+'">',used_pct.toFixed(0)+'% used</span>',
          '<span>',fmt_kes(limit),'</span>',
        '</div>',
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px">',
          miniStat("Outstanding",fmt_kes(outstanding)),
          miniStat("Limit",fmt_kes(limit)),
          miniStat("Available",fmt_kes(avail)),
        '</div>',
      '</div>',
      /* Upcoming repayments panel */
      '<div class="sp-card" style="margin-bottom:0">',
        '<div class="sp-card-header"><div class="sp-card-title">',I.clock,' Upcoming repayments</div></div>',
        upcoming.length ? upcoming.map(function(u){
          return [
            '<div class="sp-repay-item">',
              '<div class="sp-repay-date"><div class="sp-repay-day">',day_of(u.date),'</div><div class="sp-repay-mon">',mon_of(u.date),'</div></div>',
              '<div style="flex:1"><div class="sp-repay-label">',esc(u.label),'</div><div class="sp-repay-sub">',esc(u.ref),'</div></div>',
              '<div class="sp-repay-amt">',fmt_kes(u.amount),'</div>',
            '</div>',
          ].join("");
        }).join("") :
        '<div style="text-align:center;padding:24px 0;color:#aaa;font-size:13px">No upcoming repayments.</div>',
      '</div>',
    '</div>',

    /* Two panels: loan progress + activity */
    '<div class="sp-panels">',
      /* Loan progress */
      '<div class="sp-card" style="margin-bottom:0">',
        '<div class="sp-card-header"><div class="sp-card-title">',I.credit,' Loan progress</div>',
          loans.length ? '<button class="sp-card-action" onclick="spTab(\'loans\')">View all \u2192</button>' : "",
        '</div>',
        loans.length ? loans.slice(0,3).map(function(l){
          var pct = flt(l.loan_amount)>0 ? Math.min(100,(flt(l.total_amount_paid)/flt(l.loan_amount)*100)) : 0;
          return [
            '<div class="sp-loan-mini">',
              '<div class="sp-loan-mini-top">',
                '<div><div class="sp-loan-mini-name">',esc(l.loan_type||l.name),'</div>',
                '<div class="sp-loan-mini-meta">',esc(l.name),' &middot; ',esc(l.repayment_periods||"--"),' mo</div></div>',
                '<span class="pill '+((l.status||"").toLowerCase().indexOf("overdue")!==-1?"pill-red":"pill-green")+'">',esc(l.status||"Active"),'</span>',
              '</div>',
              '<div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa">',
                '<span>Repaid: ',fmt_kes(l.total_amount_paid),'</span>',
                '<span>Balance: ',fmt_kes(l.outstanding_amount),'</span>',
              '</div>',
              '<div class="sp-loan-mini-bar"><div class="sp-loan-mini-fill" style="width:'+pct.toFixed(0)+'%"></div></div>',
              '<div class="sp-loan-mini-pct">',pct.toFixed(0),'% repaid</div>',
            '</div>',
          ].join("");
        }).join("") :
        '<div style="text-align:center;padding:24px 0;color:#aaa;font-size:13px">No active loans. <button class="sp-card-action" onclick="spTab(\'apply\')">Apply \u2192</button></div>',
      '</div>',
      /* Activity feed */
      '<div class="sp-card" style="margin-bottom:0">',
        '<div class="sp-card-header"><div class="sp-card-title">',I.list,' Recent activity</div></div>',
        (s.recent_activity&&s.recent_activity.length) ? s.recent_activity.map(function(a){
          var dotCls = a.type==="deposit"?"background:#dcfce7;color:#16a34a":a.type==="withdrawal"?"background:#fee2e2;color:#dc2626":a.type==="loan"?"background:#fef9c3;color:#d97706":"background:#dbeafe;color:#2563eb";
          var icon = a.type==="deposit"?"↓":a.type==="withdrawal"?"↑":a.type==="loan"?"₤":"✦";
          return [
            '<div class="sp-act-item">',
              '<div class="sp-act-dot" style="',dotCls,'">',icon,'</div>',
              '<div><div class="sp-act-text">',esc(a.description),'</div><div class="sp-act-time">',fmt_date(a.date),'</div></div>',
            '</div>',
          ].join("");
        }).join("") :
        activityFromLoans(s),
      '</div>',
    '</div>',

    '</div>',
  ].join("");
}

function activityFromLoans(s){
  var items = [];
  (s.active_loans||[]).forEach(function(l){
    items.push('<div class="sp-act-item"><div class="sp-act-dot" style="background:#fef9c3;color:#d97706">₤</div><div><div class="sp-act-text">Loan disbursed — <strong>'+fmt_kes(l.loan_amount)+'</strong> ('+esc(l.loan_type||l.name)+')</div><div class="sp-act-time">'+fmt_date(l.repayment_start_date)+'</div></div></div>');
  });
  if(!items.length) return '<div style="text-align:center;padding:24px 0;color:#aaa;font-size:13px">No recent activity.</div>';
  return items.slice(0,4).join("");
}

function metric(cls,label,value,sub){
  return ['<div class="sp-metric'+(cls?" "+cls:"")+'">','<div class="sp-metric-label">',label,'</div>','<div class="sp-metric-value">',value,'</div>',sub?'<div class="sp-metric-sub">'+sub+'</div>':"","</div>"].join("");
}
function miniStat(label, val){
  return '<div style="text-align:center"><div style="font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#aaa;margin-bottom:3px">'+esc(label)+'</div><div style="font-size:12px;font-weight:600;color:#1a1a1a;font-family:\'DM Mono\',monospace">'+esc(val)+'</div></div>';
}

/* ================================================================
   SAVINGS
================================================================ */
function renderSavingsTab(main){
  main.innerHTML = skeleton("Savings account");
  api("get_savings_transactions",{limit:200,offset:0}).then(function(txs){
    S.savings_tx = txs||[];
    var s=S.summary;
    var dep=S.savings_tx.filter(function(t){return t.transaction_type==="Deposit";}).reduce(function(a,t){return a+flt(t.amount);},0);
    var wdr=S.savings_tx.filter(function(t){return t.transaction_type==="Withdrawal";}).reduce(function(a,t){return a+flt(t.amount);},0);
    var intr=S.savings_tx.filter(function(t){return t.transaction_type==="Interest";}).reduce(function(a,t){return a+flt(t.amount);},0);
    main.innerHTML=[
      '<div class="sp-section active">',
      '<div class="sp-section-header"><div class="sp-section-title">Savings account</div><div class="sp-section-sub">',esc(s.savings&&s.savings.name||"--"),'</div></div>',
      '<div class="sp-metrics">',
        metric("accent","Current balance",fmt_kes(s.savings_balance),""),
        metric("","Total deposited",fmt_kes(dep),"All time"),
        metric("","Total withdrawn",fmt_kes(wdr),"All time"),
        metric("","Interest earned",fmt_kes(intr),"All time"),
      '</div>',
      '<div class="sp-card"><div class="sp-card-header"><div class="sp-card-title">',I.list,' Savings transactions</div></div>',
      '<div class="sp-table-wrap">',
      S.savings_tx.length ? [
        '<table class="sp-table"><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Remarks</th><th class="num">Amount (KES)</th><th class="num">Balance (KES)</th></tr></thead><tbody>',
        S.savings_tx.map(function(t){
          var isWdr=t.transaction_type==="Withdrawal";
          return '<tr><td style="white-space:nowrap">'+fmt_date(t.transaction_date)+'</td><td>'+txPill(t.transaction_type)+'</td><td style="font-family:\'DM Mono\',monospace;font-size:12px">'+esc(t.reference_name||"--")+'</td><td style="color:#888;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.remarks||"")+'</td><td class="num '+(isWdr?"dr":"cr")+'">'+(isWdr?"\u2212":"+")+Number(t.amount||0).toLocaleString()+'</td><td class="num">'+Number(t.running_balance||0).toLocaleString()+'</td></tr>';
        }).join(""),
        '</tbody></table>',
      ].join("") : emptyState("No savings transactions found."),
      '</div></div></div>',
    ].join("");
  }).catch(function(e){ main.innerHTML=errState(e); });
}

  main.innerHTML=skeleton("Share capital");
  api("get_share_ledger",{limit:200,offset:0}).then(function(entries){
    S.shares=entries||[];
    var s=S.summary;
    main.innerHTML=[
      '<div class="sp-section active">',
      '<div class="sp-section-header"><div class="sp-section-title">Share capital</div><div class="sp-section-sub">Your equity ownership in the SACCO</div></div>',
      '<div class="sp-metrics">',
        metric("accent","Shares held",(s.total_shares||0).toLocaleString()+" shares",""),
        metric("","Share value",fmt_kes(s.share_value),"At KES "+flt(s.share_price).toLocaleString()+" per share"),
      '</div>',
      '<div class="sp-card"><div class="sp-card-header"><div class="sp-card-title">',I.list,' Share ledger</div></div>',
      '<div class="sp-table-wrap">',
      S.shares.length ? [
        '<table class="sp-table"><thead><tr><th>Date</th><th>Type</th><th class="num">Shares</th><th class="num">Running total</th><th>Remarks</th></tr></thead><tbody>',
        S.shares.map(function(e){
          var isPurch=e.entry_type==="Purchase";
          return '<tr><td style="white-space:nowrap">'+fmt_date(e.posting_date)+'</td><td><span class="pill '+(isPurch?"pill-green":"pill-red")+'">'+esc(e.entry_type||"--")+'</span></td><td class="num '+(isPurch?"cr":"dr")+'">'+(isPurch?"+":"\u2212")+Number(e.shares_quantity||0).toLocaleString()+'</td><td class="num">'+Number(e.running_total||0).toLocaleString()+'</td><td style="color:#888">'+esc(e.remarks||"")+'</td></tr>';
        }).join(""),
        '</tbody></table>',
      ].join("") : emptyState("No share ledger entries found."),
      '</div></div></div>',
    ].join("");
  }).catch(function(e){ main.innerHTML=errState(e); });
}

/* ================================================================
   TRANSACTIONS
================================================================ */
function renderTxTab(main){
  main.innerHTML=skeleton("All transactions");
  var p1=S.savings_tx?Promise.resolve(S.savings_tx):api("get_savings_transactions",{limit:200,offset:0});
  var p2=S.shares?Promise.resolve(S.shares):api("get_share_ledger",{limit:200,offset:0});
  Promise.all([p1,p2]).then(function(res){
    S.savings_tx=res[0]||[]; S.shares=res[1]||[];
    var combined=[];
    S.savings_tx.forEach(function(t){ combined.push({date:t.transaction_date,cat:"Savings",type:t.transaction_type,ref:t.reference_name,remarks:t.remarks,amount:t.amount,cr:t.transaction_type!=="Withdrawal"}); });
    S.shares.forEach(function(t){ combined.push({date:t.posting_date,cat:"Shares",type:t.entry_type,ref:t.name,remarks:t.remarks,amount:t.shares_quantity,cr:t.entry_type==="Purchase"}); });
    (S.summary.active_loans||[]).forEach(function(l){ combined.push({date:l.repayment_start_date,cat:"Loan",type:"Disbursement",ref:l.name,remarks:l.loan_type,amount:l.loan_amount,cr:true}); });
    combined.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    window._spTxAll=combined;
    main.innerHTML=[
      '<div class="sp-section active">',
      '<div class="sp-section-header"><div class="sp-section-title">All transactions</div><div class="sp-section-sub">Combined view \u2014 savings, shares, loans</div></div>',
      '<div class="sp-filter-row">',
        '<select id="tx-cat" onchange="spFilterTx()"><option value="">All categories</option><option>Savings</option><option>Shares</option><option>Loan</option></select>',
        '<input type="month" id="tx-mon" value="'+new Date().toISOString().slice(0,7)+'" onchange="spFilterTx()">',
      '</div>',
      '<div class="sp-card"><div id="tx-body" class="sp-table-wrap">',txTable(combined),'</div></div></div>',
    ].join("");
    window.spFilterTx=function(){
      var cat=document.getElementById("tx-cat").value;
      var mon=document.getElementById("tx-mon").value;
      var f=window._spTxAll.filter(function(t){ return(!cat||t.cat===cat)&&(!mon||(t.date||"").startsWith(mon)); });
      document.getElementById("tx-body").innerHTML=txTable(f);
    };
  }).catch(function(e){ main.innerHTML=errState(e); });
}

function txTable(rows){
  if(!rows.length) return emptyState("No transactions match the selected filters.");
  var catPill=function(c){ var m={Savings:"pill-green",Shares:"pill-blue",Loan:"pill-amber"}; return '<span class="pill '+(m[c]||"pill-gray")+'">'+c+'</span>'; };
  return ['<table class="sp-table"><thead><tr><th>Date</th><th>Category</th><th>Type</th><th>Reference</th><th>Remarks</th><th class="num">Amount</th></tr></thead><tbody>',
    rows.map(function(t){
      return '<tr><td style="white-space:nowrap">'+fmt_date(t.date)+'</td><td>'+catPill(t.cat)+'</td><td style="color:#555">'+esc(t.type||"--")+'</td><td style="font-family:\'DM Mono\',monospace;font-size:12px">'+esc(t.ref||"--")+'</td><td style="color:#888;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.remarks||"")+'</td><td class="num '+(t.cr?"cr":"dr")+'">'+(t.cr?"+":"\u2212")+Number(t.amount||0).toLocaleString()+'</td></tr>';
    }).join(""),
  '</tbody></table>'].join("");
}

function renderLoansTab(main){

      metric("","Active loans",loans.length,""),
      metric("accent","Total outstanding",fmt_kes(S.summary.outstanding_loans),""),
      metric("","Total repaid",fmt_kes(paid),""),
    '</div>',
    loans.length ? loans.map(function(l){ return '<div class="sp-loan-card" id="lc-'+esc(l.name)+'">'+loanCardHTML(l,true)+'</div>'; }).join("") :

function loanCardHTML(l,withSchedule){
  var pct=flt(l.loan_amount)>0?Math.min(100,(flt(l.total_amount_paid)/flt(l.loan_amount)*100)):0;
  var late=(l.status||"").toLowerCase().indexOf("overdue")!==-1;
  return [
    '<div class="sp-loan-top"><div><div class="sp-loan-name">',esc(l.loan_type||l.name),'</div><div class="sp-loan-meta">',esc(l.name),' &middot; ',esc(l.repayment_periods||"--"),' months &middot; from ',fmt_date(l.repayment_start_date),'</div></div>',
    '<span class="pill '+(late?"pill-red":"pill-green")+'">',esc(l.status||"Active"),'</span></div>',
    '<div class="sp-loan-bar-labels"><span>Repaid: ',fmt_kes(l.total_amount_paid),'</span><span>Outstanding: ',fmt_kes(l.outstanding_amount),'</span></div>',
    '<div class="sp-loan-bar"><div class="sp-loan-bar-fill'+(late?" late":"") +'" style="width:'+pct.toFixed(0)+'%"></div></div>',
    '<div class="sp-loan-stats">',
      '<div class="sp-loan-stat"><span>Loan amount</span><strong>',fmt_kes(l.loan_amount),'</strong></div>',
      '<div class="sp-loan-stat"><span>Rate</span><strong>',flt(l.rate_of_interest),'% p.a.</strong></div>',
      '<div class="sp-loan-stat"><span>Repaid</span><strong>',pct.toFixed(0),'%</strong></div>',
    '</div>',
    withSchedule?['<button class="sp-loan-schedule-toggle" id="st-'+esc(l.name)+'">',I.chevdown,' View repayment schedule</button>','<div class="sp-loan-schedule-wrap" id="sw-'+esc(l.name)+'"></div>'].join(""):"",
  ].join("");
}

function scheduleTable(rows){
  if(!rows||!rows.length) return emptyState("No schedule available.");
  return ['<div class="sp-table-wrap"><table class="sp-table" style="font-size:12px"><thead><tr><th>#</th><th>Due date</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>',
    rows.map(function(r,i){
      var sc=r.status==="Paid"?"pill-green":r.status==="Partially Paid"?"pill-amber":"pill-gray";
      return '<tr><td style="color:#aaa">'+(i+1)+'</td><td style="white-space:nowrap">'+fmt_date(r.payment_date)+'</td><td class="num">'+Number(r.principal_amount||0).toLocaleString()+'</td><td class="num">'+Number(r.interest_amount||0).toLocaleString()+'</td><td class="num" style="font-weight:500">'+Number(r.total_payment||0).toLocaleString()+'</td><td class="num">'+Number(r.balance_loan_amount||0).toLocaleString()+'</td><td><span class="pill '+sc+'">'+esc(r.status||"Pending")+'</span></td></tr>';
    }).join(""),
  '</tbody></table></div>'].join("");
}

function renderApplyTab(main){

      is_self:         true,
      status:          "Self",
    }];

    main.innerHTML=[
      '<div class="sp-section active">',
      '<div class="sp-section-header"><div class="sp-section-title">Apply for a loan</div><div class="sp-section-sub">Submit a new loan application via Loan Application</div></div>',
      '<div class="sp-info-box">',I.info,
        '<div>Your borrowing limit is <strong>',fmt_kes(s.loan_limit),'</strong> (',flt(s.loan_multiplier),'&times; savings of ',fmt_kes(s.savings_balance),'). Outstanding: <strong>',fmt_kes(s.outstanding_loans),'</strong>. Available: <strong style="color:#1a3c2e">',fmt_kes(avail),'</strong>. All loans are secured by SACCO Savings Account pledges (savings &times; multiplier).</div>',
      '</div>',
      '<div id="la-alert"></div>',

      /* Loan details card */
      '<div class="sp-card">',
        '<div class="sp-card-header"><div class="sp-card-title">',I.credit,' Loan details</div></div>',
        '<div class="sp-form-grid">',
          '<div class="sp-form-group"><label>Loan product *</label>',
            '<select id="la-type" onchange="spApplyRate()">',
              '<option value="">-- select product --</option>',
              S.loan_types.map(function(lt){ return '<option value="'+esc(lt.name)+'" data-rate="'+flt(lt.rate_of_interest)+'">'+esc(lt.name)+' \u2014 '+flt(lt.rate_of_interest)+'% p.a.</option>'; }).join(""),
            '</select>',
          '</div>',
          '<div class="sp-form-group"><label>Amount (KES) *</label>',
            '<input type="number" id="la-amt" min="1000" max="'+avail+'" step="1000" placeholder="e.g. 50,000" oninput="spApplyBar()">',
            '<div class="sp-form-hint">Maximum: '+fmt_kes(avail)+'</div>',
          '</div>',
        '</div>',
        '<div class="sp-limit-bar-wrap">',
          '<div class="sp-limit-labels"><span id="la-bar-lbl">Enter amount above</span><span>'+fmt_kes(avail)+' available</span></div>',
          '<div class="sp-limit-bar"><div class="sp-limit-fill" id="la-bar" style="width:0%"></div></div>',
        '</div>',
        '<div class="sp-form-grid">',
          '<div class="sp-form-group"><label>Repayment period (months) *</label>',
            '<input type="number" id="la-mo" min="1" max="60" placeholder="e.g. 12" oninput="spApplyCalc()">',
          '</div>',
          '<div class="sp-form-group"><label>Est. monthly instalment</label>',
            '<input type="text" id="la-inst" readonly placeholder="Auto-calculated" style="background:#f7f5f2;color:#555">',
          '</div>',
        '</div>',
        '<div class="sp-form-grid">',
          '<div class="sp-form-group"><label>Loan purpose *</label>',
            '<select id="la-purpose">',
              '<option value="">-- select --</option>',
              '<option>Business</option><option>Education / school fees</option><option>Medical</option><option>Home improvement</option><option>Agriculture</option><option>Emergency</option><option>Other</option>',
            '</select>',
          '</div>',
          '<div class="sp-form-group"><label>Interest rate (p.a.)</label>',
            '<input type="text" id="la-rate" readonly placeholder="Set by product" style="background:#f7f5f2;color:#555">',
          '</div>',
        '</div>',
        '<div class="sp-form-group" style="margin-bottom:14px"><label>Additional notes</label>',
          '<textarea id="la-notes" placeholder="Optional"></textarea>',
        '</div>',
      '</div>',

      /* Guarantors card */
      '<div class="sp-card">',
        '<div class="sp-card-header">',
          '<div class="sp-card-title">',I.shield,' Guarantors &amp; pledges</div>',
        '</div>',
        '<div class="sp-info-box" style="margin-bottom:14px">',I.info,
          '<div>Every loan must be secured by SACCO Savings Account pledges. Your own savings account is automatically pledged first. Add other SACCO members as additional guarantors &mdash; their savings will back the loan. Total pledge value must equal or exceed the loan amount. External guarantors receive an email to confirm before securities are created.</div>',
        '</div>',

        /* Search to add guarantor */
        '<div id="g-search-area" style="margin-bottom:16px">',
          '<label style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#aaa;display:block;margin-bottom:6px">Search member to add as guarantor</label>',
          '<div class="sp-member-search-wrap">',
            '<input type="text" class="sp-member-search-input" id="g-search" placeholder="Type name or member number\u2026" autocomplete="off" oninput="spSearchMembers(this.value)">',
            '<div class="sp-member-dropdown" id="g-dropdown"></div>',
          '</div>',
        '</div>',

        /* Guarantor list */
        '<div id="g-list"></div>',

        /* Pledge progress */
        '<div class="sp-pledge-progress" id="pledge-progress"></div>',
      '</div>',

      '<div class="sp-form-actions">',
        '<button class="sp-btn sp-btn-ghost" onclick="spTab(\'loans\')">Cancel</button>',
        '<button class="sp-btn sp-btn-primary" id="la-sub" onclick="spApplySubmit()">',I.plus,' Submit application</button>',
      '</div>',
      '</div>',
    ].join("");

    /* Rate helpers */
    window.spApplyRate=function(){
      var sel=document.getElementById("la-type");
      var opt=sel.options[sel.selectedIndex];
      document.getElementById("la-rate").value=opt&&opt.dataset.rate?opt.dataset.rate+"% p.a.":"";
      spApplyCalc();
    };
    window.spApplyBar=function(){
      var amt=parseFloat(document.getElementById("la-amt").value)||0;
      var pct=window._spAvail>0?Math.min(100,(amt/window._spAvail*100)):0;
      var bar=document.getElementById("la-bar");
      bar.style.width=pct+"%";
      bar.className="sp-limit-fill"+(pct>90?" danger":"");
      document.getElementById("la-bar-lbl").textContent=amt?fmt_kes(amt)+" requested":"Enter amount above";
      spApplyCalc();
      spRenderGuarantors();
    };
    window.spApplyCalc=function(){
      var amt=parseFloat(document.getElementById("la-amt").value)||0;
      var mo=parseInt(document.getElementById("la-mo").value)||0;
      var sel=document.getElementById("la-type");
      var opt=sel.options[sel.selectedIndex];
      var r=parseFloat(opt&&opt.dataset.rate?opt.dataset.rate:0)||0;
      var inst="";
      if(amt>0&&mo>0){ var mr=r/100/12; inst=mr===0?fmt_kes((amt/mo).toFixed(0)):fmt_kes(((amt*mr*Math.pow(1+mr,mo))/(Math.pow(1+mr,mo)-1)).toFixed(0)); }
      document.getElementById("la-inst").value=inst;
    };

    /* Member search */
    var searchTimer=null;
    window.spSearchMembers=function(q){
      clearTimeout(searchTimer);
      var dd=document.getElementById("g-dropdown");
      if(!q||q.length<2){ dd.classList.remove("open"); return; }
      searchTimer=setTimeout(function(){
        api("search_members",{query:q, exclude:[window._spGuarantors.map(function(g){return g.member;}).join(",")]}).then(function(members){
          if(!members||!members.length){ dd.innerHTML='<div style="padding:12px 14px;font-size:13px;color:#aaa">No members found.</div>'; dd.classList.add("open"); return; }
          dd.innerHTML=members.map(function(m){
            var inits=initials(m.full_name||m.member_name||m.name);
            // FIXED: Pass savings_account and savings_balance as 4th and 5th parameters
            var savingsAccount = m.savings_account || "";
            var savingsBalance = m.savings_balance || 0;
            return '<div class="sp-member-option" onclick="spAddGuarantor(\''+esc(m.name)+'\',\''+esc(m.full_name||m.member_name||m.name)+'\',\''+esc(m.member_no||m.name)+'\',\''+esc(savingsAccount)+'\','+savingsBalance+')">'+
              '<div class="sp-member-opt-avatar">'+inits+'</div>'+
              '<div><div class="sp-member-opt-name">'+esc(m.full_name||m.member_name||m.name)+'</div>'+
              '<div class="sp-member-opt-sub">'+esc(m.member_no||m.name)+' &middot; Savings: '+fmt_kes(savingsBalance)+'</div></div>'+
            '</div>';
          }).join("");
          dd.classList.add("open");
        }).catch(function(){});
      },320);
    };

    /* Close dropdown on outside click */
    document.addEventListener("click",function(e){
      var dd=document.getElementById("g-dropdown");
      if(dd&&!dd.contains(e.target)&&e.target.id!=="g-search"){ dd.classList.remove("open"); }
    });

    window.spAddGuarantor=function(member,name,member_no,savings_account,savings_balance){
      var dd=document.getElementById("g-dropdown");
      if(dd) dd.classList.remove("open");
      var inp=document.getElementById("g-search");
      if(inp) inp.value="";
      
      // Check if already added
      if(window._spGuarantors.find(function(g){return g.member===member;})) {
        frappe.msgprint(__("This member is already added as a guarantor."));
        return;
      }
      
      // Validate savings account exists
      if(!savings_account) {
        frappe.msgprint(__("This member does not have a Savings Account and cannot be a guarantor."));
        return;
      }
      
      var multiplier = flt(S.summary.loan_multiplier) || 3;
      var maxPledge = flt(savings_balance) * multiplier;
      // Set default pledge to a reasonable amount (e.g., max or 0 - user will enter)
      var defaultPledge = 0; // Let user enter the amount manually
      
      window._spGuarantors.push({
        member: member,
        member_name: name,
        member_no: member_no,
        savings_account: savings_account,
        savings_balance: flt(savings_balance),
        pledge_value: defaultPledge,
        pledge_max: maxPledge,
        is_self: false,
        status: "Pending",
      });
      spRenderGuarantors();
    };

    window.spRemoveGuarantor=function(idx){
      window._spGuarantors.splice(idx,1);
      spRenderGuarantors();
    };

    window.spGuarantorPledgeChanged=function(idx,val){
      var g=window._spGuarantors[idx];
      var v=flt(val);
      /* Cap at pledge_max (savings × multiplier) */
      if(g.pledge_max&&v>g.pledge_max) v=g.pledge_max;
      g.pledge_value=v;
      spRenderGuarantors();
    };

    spRenderGuarantors();

  }).catch(function(e){ main.innerHTML=errState(e); });
}

function spRenderGuarantors(){
  var list=document.getElementById("g-list");
  var prog=document.getElementById("pledge-progress");
  if(!list||!prog) return;

  var gs=window._spGuarantors||[];
  var loanAmt=parseFloat((document.getElementById("la-amt")||{}).value)||0;
  var multiplier=flt(S.summary.loan_multiplier)||3;

  var totalPledge=gs.reduce(function(a,g){return a+flt(g.pledge_value);},0);
  var covered=totalPledge>=loanAmt&&loanAmt>0;
  var pct=loanAmt>0?Math.min(100,(totalPledge/loanAmt*100)):0;

  list.innerHTML=gs.map(function(g,i){
    var statusPill=g.is_self?
      '<span class="pill pill-blue">Self (You)</span>':
      g.status==="Confirmed"?'<span class="pill pill-green">✓ Confirmed</span>':
      g.status==="Pending"?'<span class="pill pill-amber">⏳ Pending email</span>':
      '<span class="pill pill-red">✗ Declined</span>';
    
    var pledgeMax = flt(g.pledge_max) || (flt(g.savings_balance) * multiplier);
    
    return [
      '<div class="sp-guarantor-card">',
        '<div class="sp-g-avatar">',initials(g.member_name),'</div>',
        '<div class="sp-g-info">',
          '<div class="sp-g-name">',esc(g.member_name),g.is_self?' <span style="font-size:11px;color:#aaa">(You)</span>':"",'</div>',
          // REMOVED: Savings balance display - just show member number and account
          '<div class="sp-g-sub">',esc(g.member_no),' &middot; Account: ',esc(g.savings_account||"—"),'</div>',
        '</div>',
        '<div class="sp-g-actions">',
          '<div style="text-align:right">',
            '<div style="font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#aaa;margin-bottom:4px">Pledge amount (KES)</div>',
            '<div style="display:flex;align-items:center;gap:7px">',
              '<input type="number" class="sp-g-shares-input" style="width:130px" min="0" max="'+pledgeMax+'" step="1000" value="'+flt(g.pledge_value).toFixed(0)+'" onchange="spGuarantorPledgeChanged('+i+',this.value)" oninput="spGuarantorPledgeChanged('+i+',this.value)">',
              '<span style="font-size:10px;color:#aaa;white-space:nowrap">max: '+fmt_kes(pledgeMax)+'</span>',
            '</div>',
          '</div>',
          statusPill,
          !g.is_self?'<button class="sp-g-remove" onclick="spRemoveGuarantor('+i+')" title="Remove">'+I.trash+'</button>':"",
        '</div>',
      '</div>',
    ].join("");
  }).join("");

  /* Pledge summary bar */
  prog.innerHTML=[
    '<div class="sp-guarantor-summary">',
      '<div>',
        'Total pledged: <strong>',fmt_kes(totalPledge),'</strong>',
        ' &nbsp;&middot;&nbsp; Loan: <strong>',fmt_kes(loanAmt),'</strong>',
        loanAmt>0?' &nbsp;&middot;&nbsp; Shortfall: <strong style="color:'+(covered?'#16a34a':'#dc2626')+'">'+fmt_kes(Math.max(0,loanAmt-totalPledge))+'</strong>':"",
      '</div>',
      covered?'<span class="pill pill-green">'+I.check+' Covered</span>':
              '<span class="pill pill-amber">⚠ Insufficient</span>',
    '</div>',
    loanAmt>0?[
      '<div style="margin-top:8px">',
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:4px">',
          '<span>Pledge coverage</span><span>',pct.toFixed(0),'%</span>',
        '</div>',
        '<div class="sp-pledge-bar"><div class="sp-pledge-fill'+(covered?" over":"") +'" style="width:'+Math.min(100,pct).toFixed(0)+'%"></div></div>',
      '</div>',
    ].join(""):"",
  ].join("");
}


window.spApplySubmit=function(){
  var type    =document.getElementById("la-type").value;
  var amount  =parseFloat(document.getElementById("la-amt").value);
  var months  =parseInt(document.getElementById("la-mo").value);
  var purpose =document.getElementById("la-purpose").value;
  var notes   =document.getElementById("la-notes").value;
  var alertEl =document.getElementById("la-alert");
  alertEl.innerHTML="";

  if(!type||!amount||!months||!purpose){
    alertEl.innerHTML=alertHTML("error","Please fill in all required fields.");
    alertEl.scrollIntoView({behavior:"smooth"}); return;
  }
  if(amount>window._spAvail){
    alertEl.innerHTML=alertHTML("error","Amount exceeds your available credit of "+fmt_kes(window._spAvail)+".");
    return;
  }

  var gs=window._spGuarantors||[];
  
  // Debug: Log guarantors to console
  console.log("Submitting guarantors:", JSON.stringify(gs));
  
  if(!gs.length){
    alertEl.innerHTML=alertHTML("error","Please add at least one guarantor (yourself counts).");
    return;
  }

  /* Validate each guarantor has a savings account and non-zero pledge */
  var missingAcct=gs.find(function(g){return !g.savings_account;});
  if(missingAcct){
    alertEl.innerHTML=alertHTML("error",esc(missingAcct.member_name)+" has no linked Savings Account and cannot be a guarantor.");
    alertEl.scrollIntoView({behavior:"smooth"}); return;
  }
  var zeroPledge=gs.find(function(g){return flt(g.pledge_value)<=0;});
  if(zeroPledge){
    alertEl.innerHTML=alertHTML("error","All guarantors must have a pledge value greater than zero. "+esc(zeroPledge.member_name)+" has KES 0 pledged.");
    alertEl.scrollIntoView({behavior:"smooth"}); return;
  }

  /* Validate total pledge coverage */
  var totalPledgedValue=gs.reduce(function(a,g){return a+flt(g.pledge_value);},0);
  if(totalPledgedValue<amount){
    alertEl.innerHTML=alertHTML("error","Total pledged savings value ("+fmt_kes(totalPledgedValue)+") does not cover the loan amount ("+fmt_kes(amount)+"). Please increase pledges or add more guarantors.");
    alertEl.scrollIntoView({behavior:"smooth"}); return;
  }

  var btn=document.getElementById("la-sub");
  btn.disabled=true; btn.textContent="Submitting\u2026";

  // Prepare guarantors data
  var guarantorsData = gs.map(function(g){
    return { 
      member: g.member, 
      member_name: g.member_name, 
      savings_account: g.savings_account || '', 
      pledge_value: flt(g.pledge_value), 
      is_self: g.is_self || false 
    };
  });
  
  console.log("Sending to API:", guarantorsData);

  api("submit_loan_application_v2",{
    loan_product: type,
    loan_amount: amount,
    repayment_periods: months,
    purpose: purpose,
    description: notes,
    guarantors: JSON.stringify(guarantorsData),
  }).then(function(res){
    alertEl.innerHTML=alertHTML("success","Application <strong>"+esc(res.application)+"</strong> submitted. "+
      (res.emails_sent>0?"Confirmation emails sent to "+res.emails_sent+" guarantor"+(res.emails_sent>1?"s":"")+".":" Your self-pledge has been recorded.")
    );
    var _selfMax=flt(S.summary.savings_balance)*flt(S.summary.loan_multiplier);
    window._spGuarantors=[{
      member:          S.summary.member.name,
      member_name:     S.summary.member.full_name||(S.summary.member.first_name||""),
      member_no:       S.summary.member.member_no||S.summary.member.name,
      savings_account: S.summary.savings_account||"",
      savings_balance: flt(S.summary.savings_balance),
      pledge_value:    _selfMax,
      pledge_max:      _selfMax,
      is_self:         true,
      status:          "Self",
    }];
    ["la-type","la-amt","la-mo","la-purpose","la-notes"].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=""; });
    document.getElementById("la-bar").style.width="0%";
    document.getElementById("la-inst").value="";
    document.getElementById("la-rate").value="";
    spRenderGuarantors();
    alertEl.scrollIntoView({behavior:"smooth"});
    /* Refresh applications list */
    S.applications=null;
  }).catch(function(e){
    console.error("Submission error:", e);
    var errorMsg = typeof e === "string" ? e : (e.message || "Submission failed. Please try again.");
    alertEl.innerHTML=alertHTML("error", errorMsg);
    alertEl.scrollIntoView({behavior:"smooth"});
  }).finally(function(){ 
    btn.disabled=false; 
    btn.innerHTML=I.plus+" Submit application"; 
  });
};

/* ================================================================
   HELPERS
================================================================ */
function txPill(type){ var m={Deposit:"pill-green",Withdrawal:"pill-red",Interest:"pill-blue"}; return '<span class="pill '+(m[type]||"pill-gray")+'">'+esc(type||"--")+'</span>'; }
function alertHTML(type,msg){ var cls=type==="success"?"sp-alert-success":"sp-alert-error"; var icon=type==="success"?I.check:I.x; return '<div class="sp-alert '+cls+'">'+icon+'<span>'+msg+'</span></div>'; }
function skeleton(title){ return '<div class="sp-section active"><div class="sp-section-header"><div class="sp-section-title">'+title+'</div></div><div class="sp-metrics">'+[1,2,3,4].map(function(){return '<div class="sp-skeleton sp-skel-metric"></div>';}).join("")+'</div><div class="sp-card">'+[1,2,3,4,5].map(function(){return '<div class="sp-skeleton sp-skel-row"></div>';}).join("")+'</div></div>'; }
function emptyState(msg){ return '<div class="sp-empty">'+I.list+'<p>'+esc(msg)+'</p></div>'; }
function errState(e){ var msg=typeof e==="string"?e:"An error occurred loading this section."; return '<div class="sp-card"><div class="sp-empty">'+I.x+'<p style="color:#dc2626">'+esc(msg)+'</p></div></div>'; }

          '<div style="font-size:32px;margin-bottom:12px">\u26A0\uFE0F</div>',
          '<div style="font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:8px">Unable to load portal</div>',
          '<div style="font-size:13px;color:#888;margin-bottom:20px">'+esc(msg)+'</div>',
          '<a href="/login" style="color:#1a3c2e;font-weight:500;font-size:13px">\u2190 Back to login</a>',
        '</div>',
      '</div>',
    ].join("");
  });
});
